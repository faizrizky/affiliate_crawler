[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threads-crawler"
version = "0.1.0"
description = "Threads crawler service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "scrapling>=0.4",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
